name: crawly-bot — PR Test & 100% Coverage Quality Gate

on:
  push:
    branches:
      - main
      - master
      - dev
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
      - master
      - dev
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: write

jobs:
  test-and-coverage-gate:
    name: crawly-bot | Automated Tests & 100% Coverage Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install runtime & test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt coverage pytest pytest-cov

      - name: Run Unit Test Suite with Coverage Tracking
        id: run_tests
        continue-on-error: true
        run: |
          python -m coverage run -m unittest discover -s tests -v > test_output.txt 2>&1
          echo "test_exit_code=$?" >> "$GITHUB_OUTPUT"
          cat test_output.txt

      - name: Verify 100% Code Coverage Threshold
        id: check_coverage
        continue-on-error: true
        run: |
          python -m coverage report -m --fail-under=100 > coverage_report.txt 2>&1
          echo "cov_exit_code=$?" >> "$GITHUB_OUTPUT"
          cat coverage_report.txt

      - name: Publish Quality Gate Job Summary
        if: always()
        run: |
          echo "## 🤖 crawly-bot — Pull Request Quality Gate" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.run_tests.outputs.test_exit_code }}" == "0" ] && [ "${{ steps.check_coverage.outputs.cov_exit_code }}" == "0" ]; then
            echo "✅ **PASSED:** All unit tests succeeded and **100% code coverage** was verified. Ready for maintainer review!" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ **BLOCKED:** Either one or more unit tests failed or total code coverage dropped below **100%**." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "> **Action Required by Contributor:** Please fix all failing test cases and add unit tests in \`tests/\` until coverage reaches **100%** before requesting maintainer review or merging." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Coverage Report" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          cat coverage_report.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: crawly-bot — Post/Update PR Status Comment & Automated Review
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- crawly-pr-quality-gate-bot -->';
            const testExit = '${{ steps.run_tests.outputs.test_exit_code }}';
            const covExit = '${{ steps.check_coverage.outputs.cov_exit_code }}';
            const passed = (testExit === '0' && covExit === '0');
            const author = context.payload.pull_request.user.login;
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            const covReport = fs.existsSync('coverage_report.txt') ? fs.readFileSync('coverage_report.txt', 'utf8') : 'Coverage report unavailable.';
            const testOutput = fs.existsSync('test_output.txt') ? fs.readFileSync('test_output.txt', 'utf8').slice(-3500) : '';

            let bodyLines = [marker];
            if (passed) {
              bodyLines.push(
                `### 🤖 crawly-bot: ✅ Quality Gate Passed (100% Tests & 100% Coverage)`,
                ``,
                `Great work @${author}! Commit \`${sha}\` passed all automated checks for **crawly: the literature assistant**:`,
                `- **Unit Test Suite:** ✅ All tests passed`,
                `- **Code Coverage Gate:** ✅ **100% coverage verified** (\`--fail-under=100\`)`,
                ``,
                `cc @lokeshsk — This Pull Request meets all quality gate requirements and is ready for maintainer review & merging.`,
                ``,
                `#### 📊 Verified Coverage Report`,
                '```text',
                covReport.trim(),
                '```'
              );
            } else {
              bodyLines.push(
                `### 🤖 crawly-bot: ❌ Pull Request Blocked — Action Required (@${author})`,
                ``,
                `Thank you for contributing to **crawly: the literature assistant** (\`crawly\`)!`,
                `Before this Pull Request is forwarded to the maintainer (@lokeshsk) for review and merging, **all unit tests must pass** and **total code coverage must be 100%**.`,
                ``,
                `- **Unit Tests Status (commit \`${sha}\`):** ${testExit === '0' ? '✅ Passed' : '❌ Failed — please fix failing tests'}`,
                `- **100% Code Coverage Status:** ${covExit === '0' ? '✅ 100% Verified' : '❌ Below 100% — please add tests for uncovered lines shown in the Missing column below'}`,
                ``,
                `#### 📊 Code Coverage Report`,
                '```text',
                covReport.trim(),
                '```',
                testExit !== '0' ? `#### 🧪 Failing Test Output\n\`\`\`text\n${testOutput.trim()}\n\`\`\`` : '',
                `#### 🛠️ How to Reproduce & Fix Locally`,
                '```bash',
                `python -m coverage run -m unittest discover -s tests -v`,
                `python -m coverage report -m --fail-under=100`,
                '```',
                `Once both commands pass locally with **0 errors** and **100% coverage**, push your fix to this branch and **crawly-bot** will automatically re-check your PR.`
              );
            }

            const body = bodyLines.filter(Boolean).join('\n');

            // Update existing sticky comment if present, otherwise create a new comment
            try {
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                per_page: 100
              });
              const existing = comments.find(c => c.body && c.body.includes(marker));
              if (existing) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                  body: body
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body: body
                });
              }
            } catch (err) {
              console.log('Note: Could not post sticky comment (likely fork PR with read-only token):', err.message);
            }

            // Submit formal PR review (APPROVE or REQUEST_CHANGES)
            try {
              await github.rest.pulls.createReview({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
                event: passed ? 'APPROVE' : 'REQUEST_CHANGES',
                body: passed
                  ? `✅ crawly-bot verified 100% test pass rate and 100% code coverage on commit \`${sha}\`.`
                  : `❌ crawly-bot blocked merge on commit \`${sha}\`: please fix failing unit tests and/or restore 100% code coverage before maintainer review.`
              });
            } catch (err) {
              console.log('Note: Could not create formal PR review:', err.message);
            }

      - name: Enforce Gate Exit Code
        if: always()
        run: |
          if [ "${{ steps.run_tests.outputs.test_exit_code }}" != "0" ]; then
            echo "::error::Unit tests failed! Please fix all failing test cases before submitting for merge."
            exit 1
          fi
          if [ "${{ steps.check_coverage.outputs.cov_exit_code }}" != "0" ]; then
            echo "::error::Code coverage is below 100%! Please add unit tests for all uncovered lines before submitting for merge."
            exit 1
          fi
          echo "All tests passed and 100% code coverage verified!"

