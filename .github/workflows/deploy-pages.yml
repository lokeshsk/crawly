name: Deploy Documentation Website to GitHub Pages

on:
  push:
    branches:
      - main
      - master
    paths:
      - "docs/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  sync-gh-pages-branch:
    name: Publish docs/ to gh-pages Branch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy docs/ directory to gh-pages branch
        run: |
          git config user.name "crawly-bot"
          git config user.email "crawly.theliteratureassistant@gmail.com"
          TMP_DIR=$(mktemp -d)
          cp -r docs/. "$TMP_DIR/"
          git checkout --orphan gh-pages-temp
          git rm -rf .
          cp -r "$TMP_DIR"/. .
          touch .nojekyll
          git add -A
          git commit -m "Deploy crawly documentation website to GitHub Pages [skip ci]"
          git push origin HEAD:refs/heads/gh-pages --force
