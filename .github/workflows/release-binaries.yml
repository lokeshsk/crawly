name: crawly-bot — Auto-Versioning, Build & GitHub Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      bump_type:
        description: "Version bump type (auto, patch, minor, major)"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  auto-version-and-gate:
    name: crawly-bot | 100% Quality Gate & Semantic Versioning
    runs-on: ubuntu-latest
    # Skip if commit message explicitly has [skip ci] or [skip release] or was made by crawly-bot
    if: "!contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.head_commit.message, '[skip release]')"
    outputs:
      release_tag: ${{ steps.semver.outputs.release_tag }}
      release_version: ${{ steps.semver.outputs.release_version }}
      should_release: ${{ steps.semver.outputs.should_release }}

    steps:
      - name: Checkout repository with full history and tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify 100% Unit Tests & 100% Code Coverage Gate
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt coverage pytest pytest-cov
          python -m coverage run -m unittest discover -s tests -v
          python -m coverage report -m --fail-under=100

      - name: Compute Next Semantic Version & Tag Release
        id: semver
        env:
          INPUT_BUMP: ${{ github.event.inputs.bump_type || 'auto' }}
          COMMIT_MSG: ${{ github.event.head_commit.message || '' }}
        run: |
          git config user.name "crawly-bot"
          git config user.email "crawly.theliteratureassistant@gmail.com"
          git fetch --tags --force

          # If triggered directly by pushing a tag (v*), use that exact tag
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG_NAME#v}"
            echo "release_tag=${TAG_NAME}" >> "$GITHUB_OUTPUT"
            echo "release_version=${VERSION}" >> "$GITHUB_OUTPUT"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Check if current HEAD already has a v* tag pointing to it (and not manual workflow_dispatch)
          HEAD_TAG=$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)
          if [[ -n "${HEAD_TAG}" && "${GITHUB_EVENT_NAME}" != "workflow_dispatch" ]]; then
            VERSION="${HEAD_TAG#v}"
            echo "HEAD is already tagged at ${HEAD_TAG}; publishing release for ${HEAD_TAG}."
            echo "release_tag=${HEAD_TAG}" >> "$GITHUB_OUTPUT"
            echo "release_version=${VERSION}" >> "$GITHUB_OUTPUT"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Find latest vX.Y.Z tag (default v2.0.0 if none)
          LATEST_TAG=$(git tag -l "v[0-9]*.[0-9]*.[0-9]*" | sort -V | tail -n 1)
          if [[ -z "${LATEST_TAG}" ]]; then
            LATEST_TAG="v2.0.0"
          fi
          BASE_VER="${LATEST_TAG#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "${BASE_VER}"

          # Determine bump type (major / minor / patch)
          BUMP="${INPUT_BUMP}"
          if [[ "${BUMP}" == "auto" ]]; then
            if echo "${COMMIT_MSG}" | grep -qiE "(\[major\]|BREAKING CHANGE|^[a-z]+(\([^)]+\))?!:)"; then
              BUMP="major"
            elif echo "${COMMIT_MSG}" | grep -qiE "(\[minor\]|\[feature\]|^feat(\([^)]+\))?:)"; then
              BUMP="minor"
            else
              BUMP="patch"
            fi
          fi

          if [[ "${BUMP}" == "major" ]]; then
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0
          elif [[ "${BUMP}" == "minor" ]]; then
            MINOR=$((MINOR + 1))
            PATCH=0
          else
            PATCH=$((PATCH + 1))
          fi

          NEW_VER="${MAJOR}.${MINOR}.${PATCH}"
          NEW_TAG="v${NEW_VER}"
          echo "Auto-bumping version: ${LATEST_TAG} -> ${NEW_TAG} (${BUMP})"

          # Update version in crawly_core/__init__.py and CITATION.cff
          python - <<EOF
          from pathlib import Path
          import re

          init_p = Path("crawly_core/__init__.py")
          init_txt = init_p.read_text(encoding="utf-8")
          init_txt = re.sub(r'__version__\s*=\s*"[^"]+"', '__version__ = "${NEW_VER}"', init_txt)
          init_p.write_text(init_txt, encoding="utf-8")

          cff_p = Path("CITATION.cff")
          if cff_p.exists():
              cff_txt = cff_p.read_text(encoding="utf-8")
              cff_txt = re.sub(r'^version:\s*.*$', 'version: ${NEW_VER}', cff_txt, flags=re.MULTILINE)
              cff_p.write_text(cff_txt, encoding="utf-8")
          EOF

          git add crawly_core/__init__.py CITATION.cff
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): bump version to ${NEW_TAG} [skip ci]"
            git push origin HEAD:main
          fi

          git tag -f -a "${NEW_TAG}" -m "Release ${NEW_TAG}: crawly: the literature assistant"
          git push origin "${NEW_TAG}" --force

          echo "release_tag=${NEW_TAG}" >> "$GITHUB_OUTPUT"
          echo "release_version=${NEW_VER}" >> "$GITHUB_OUTPUT"
          echo "should_release=true" >> "$GITHUB_OUTPUT"

  build-binaries:
    name: Build Standalone Executables (${{ matrix.os }})
    needs: auto-version-and-gate
    if: needs.auto-version-and-gate.outputs.should_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: crawly-linux-bundle
          - os: windows-latest
            artifact_name: crawly-windows-bundle

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout release tag ${{ needs.auto-version-and-gate.outputs.release_tag }}
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.auto-version-and-gate.outputs.release_tag }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build & runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build Universal Bundle & Native Binary
        run: |
          python build_release.py --native

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/*

  publish-release:
    name: Publish Official GitHub Release (${{ needs.auto-version-and-gate.outputs.release_tag }})
    needs: [auto-version-and-gate, build-binaries]
    if: needs.auto-version-and-gate.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Linux & Universal Artifacts
        uses: actions/download-artifact@v4
        with:
          name: crawly-linux-bundle
          path: release_assets

      - name: Download Windows Native Executable
        uses: actions/download-artifact@v4
        with:
          name: crawly-windows-bundle
          path: release_assets_win

      - name: Consolidate Release Assets
        run: |
          if [ -f release_assets_win/crawly-windows-x86_64.exe ]; then
            cp release_assets_win/crawly-windows-x86_64.exe release_assets/
          fi
          chmod +x release_assets/crawly release_assets/crawly-linux-x86_64 release_assets/crawly.pyz || true
          ls -lh release_assets/

      - name: Create / Update Official GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.auto-version-and-gate.outputs.release_tag }}
          name: "crawly: the literature assistant (${{ needs.auto-version-and-gate.outputs.release_tag }})"
          generate_release_notes: true
          body: |
            ## 🕷️ crawly: the literature assistant — Release ${{ needs.auto-version-and-gate.outputs.release_tag }}

            **crawly** (`crawly: the literature assistant`) is an end-to-end academic research assistant for discovering scientific papers across 8+ official Open Access databases (**OpenAlex, Unpaywall, Semantic Scholar, arXiv, Europe PMC, Crossref, DOAJ, HAL, OpenAIRE**), downloading full-text PDFs within a **strict Legal Open-Access framework by default**, exporting BibTeX citations, and generating AI-powered literature reviews using local self-hosted LLMs (**Ollama, LM Studio, vLLM**) or cloud APIs (**OpenAI, Gemini, Anthropic, OpenRouter, Groq, DeepSeek**).

            ### 📦 Zero-Setup Download Options (No `pip install` Required)
            - **`crawly-universal-windows-linux.zip`**: Universal cross-platform bundle containing `crawly` (Linux/WSL/macOS launcher), `crawly.bat` (Windows launcher), `crawly.pyz` (self-contained archive with `pypdf`, `rich`, `requests`, `beautifulsoup4`), and annotated `config.json`.
            - **`crawly-linux-x86_64`**: Native standalone Linux / WSL executable binary.
            - **`crawly-windows-x86_64.exe`**: Native standalone Windows executable binary.
            - **`config.json`**: External configuration file with default values and documentation for all AI providers and academic endpoints.

            ### 🛡️ Quality & Compliance
            - **100% Automated Test & Code Coverage Verified** (`1883 / 1883` statements).
            - **Strict Legal Open-Access Default** with mandatory user risk-acceptance prompts before any optional third-party fallback.
          files: |
            release_assets/crawly-universal-windows-linux.zip
            release_assets/crawly-linux-x86_64
            release_assets/crawly-windows-x86_64.exe
            release_assets/crawly.pyz
            release_assets/config.json
